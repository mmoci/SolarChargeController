name: Publish Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push docs/wiki to GitHub Wiki
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki-repo
          cd wiki-repo
          git ls-files -z -- '*.md' | xargs -0 -r rm -f --
          cd ..
          find docs/wiki -maxdepth 1 -name '*.md' -exec cp {} wiki-repo/ \;
          cd wiki-repo
          git add -A .
          git diff --cached --quiet || (git commit -m "docs: sync wiki from docs/wiki/" && git push)
