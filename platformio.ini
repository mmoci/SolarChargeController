; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Ilib
    -Ilib/Battery
    -Ilib/ChargeController
    -Ilib/Measurements
    -Ilib/MpptController
    -Ilib/Sensors
    -Ilib/Actuators
    -Ilib/Initializer
    -Ilib/Mqtt
    -Ilib/OtaHandler
    -Ilib/Logger
    -D MQTT_CLIENT
    -D DPS_DC_CONVERTER
    -D MQTT_MAX_PACKET_SIZE=2048
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson @ ^7.0.0
monitor_dtr = 0 ; Keep DTR low on serial monitor open to avoid resetting the board and interrupting Modbus communication tests.
monitor_rts = 0 ; Keep RTS low on serial monitor open to avoid resetting the board and interrupting Modbus communication tests.

[env:esp32dev-modbus-test]
; Standalone Modbus loopback test — upload this to verify DPS5005 communication
; independently of the main firmware. Uses 4-20ma/ModbusMaster as a known-good
; reference implementation. Build/upload with: pio run -e esp32dev-modbus-test -t upload
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = -<*> +<../test_modbus/>
monitor_speed = 115200
lib_deps =
    4-20ma/ModbusMaster

[env:esp32dev-test]
; Desktop testing with Google Test
platform = native
test_framework = googletest
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Ilib
    -Ilib/Battery
    -Ilib/ChargeController
    -Ilib/Measurements
    -Ilib/MpptController
    -Ilib/Sensors
    -Ilib/Actuators
    -Ilib/Logger
    -Itest
    -std=c++17
test_ignore = src/*
build_src_filter = +<lib/Battery/> +<lib/ChargeController/> +<lib/MpptController/> +<lib/Actuators/> -<lib/>